name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18.3.1", "19.1.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify React peer line
        run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npm run check
